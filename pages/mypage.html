<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마이페이지 — TYPING.KING</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Bungee&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-theme="dark">

<div class="container">
  <header class="header" id="header"></header>

  <h1 class="page-title" id="pageTitle">MY PAGE</h1>
  <p class="page-subtitle" id="pageSubtitle">개인 통계 및 성장 추세</p>

  <div id="content">
    <div class="empty-state">
      <div class="icon">⌛</div>
      <div class="msg">데이터를 불러오는 중...</div>
    </div>
  </div>

  <footer class="footer">TYPING.KING &nbsp;·&nbsp; MY PAGE</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

<script>
const $ = id => document.getElementById(id);
let allMatches = [];
let growthChart = null;
let accChart = null;

(async function init() {
  await initHeader('mypage');

  if (!Auth.isLoggedIn()) {
    $('content').innerHTML = `
      <div class="empty-state">
        <div class="icon">🔒</div>
        <div class="msg">로그인이 필요한 페이지입니다</div>
        <a href="login.html" class="btn primary"><span class="arrow">▶</span> 로그인 하기</a>
      </div>`;
    return;
  }

  await loadData();
})();

async function loadData() {
  const profile = Auth.profile;
  const { data: matches, error } = await window.sb
    .from('matches')
    .select('*')
    .eq('user_id', Auth.user.id)
    .order('played_at', { ascending: true });

  if (error) {
    $('content').innerHTML = `<div class="empty-state"><div class="icon">✕</div><div class="msg">데이터 로드 실패: ${error.message}</div></div>`;
    return;
  }

  allMatches = matches || [];

  if (allMatches.length === 0) {
    $('content').innerHTML = `
      <div class="empty-state">
        <div class="icon">🎮</div>
        <div class="msg">아직 플레이 기록이 없습니다</div>
        <a href="../index.html" class="btn primary"><span class="arrow">▶</span> 첫 게임 시작하기</a>
      </div>`;
    return;
  }

  renderPage(profile);
}

function renderPage(profile) {
  const totalMatches = profile?.total_matches || allMatches.length;
  const totalWins = profile?.total_wins || allMatches.filter(m => m.result === 'win').length;
  const bestWpm = profile?.best_wpm || Math.max(...allMatches.map(m => m.wpm));
  const avgWpm = Math.round(allMatches.reduce((sum, m) => sum + m.wpm, 0) / allMatches.length);
  const avgAcc = Math.round(allMatches.reduce((sum, m) => sum + m.accuracy, 0) / allMatches.length);
  const winRate = Math.round((totalWins / totalMatches) * 100);
  const initial = (profile?.nickname || 'U').charAt(0).toUpperCase();

  $('content').innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar">${initial}</div>
      <div class="profile-info">
        <div class="profile-name">${profile?.nickname || '이름없음'}</div>
        <div class="profile-meta">${Auth.user.email} · 총 ${totalMatches} 경기</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat neon"><div class="stat-label">BEST WPM</div><div class="stat-value">${bestWpm}<span class="stat-unit">최고</span></div></div>
      <div class="stat pink"><div class="stat-label">AVG WPM</div><div class="stat-value">${avgWpm}<span class="stat-unit">평균</span></div></div>
      <div class="stat amber"><div class="stat-label">ACCURACY</div><div class="stat-value">${avgAcc}<span class="stat-unit">%</span></div></div>
      <div class="stat blue"><div class="stat-label">WIN RATE</div><div class="stat-value">${winRate}<span class="stat-unit">%</span></div></div>
    </div>

    <div class="chart-card">
      <div class="chart-title">WPM 성장 추세</div>
      <div class="chart-period">
        <button class="active" data-period="all">전체</button>
        <button data-period="30">30 경기</button>
        <button data-period="10">10 경기</button>
      </div>
      <canvas id="growthChart" height="180"></canvas>
    </div>

    <div class="chart-card bots">
      <div class="chart-title">봇 별 성적</div>
      <div id="botStats"></div>
    </div>

    <div class="chart-card matches">
      <div class="chart-title">최근 매치 (최신 20경기)</div>
      <table class="match-table">
        <thead>
          <tr><th>RESULT</th><th>BOT</th><th>WPM</th><th>ACC</th><th>TIME</th></tr>
        </thead>
        <tbody id="matchTbody"></tbody>
      </table>
    </div>
  `;

  renderGrowthChart('all');
  renderBotStats();
  renderMatchTable();

  document.querySelectorAll('.chart-period button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.chart-period button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrowthChart(btn.dataset.period);
    });
  });
}

function renderGrowthChart(period) {
  let data = [...allMatches];
  if (period !== 'all') {
    const n = parseInt(period, 10);
    data = data.slice(-n);
  }

  const labelsClean = data.map((_, i) => i + 1);
  const wpmData = data.map(m => m.wpm);
  const accData = data.map(m => m.accuracy);

  // 이동 평균 (5경기)
  const movingAvg = wpmData.map((_, i, arr) => {
    const start = Math.max(0, i - 4);
    const slice = arr.slice(start, i + 1);
    return Math.round(slice.reduce((a, b) => a + b, 0) / slice.length);
  });

  const ctx = $('growthChart').getContext('2d');
  if (growthChart) growthChart.destroy();

  const isDark = document.body.getAttribute('data-theme') === 'dark';
  const textColor = isDark ? '#8b96a8' : '#5a6477';
  const gridColor = isDark ? '#2a3444' : '#d9d6c8';

  growthChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labelsClean,
      datasets: [
        {
          label: 'WPM',
          data: wpmData,
          borderColor: isDark ? '#00ff9c' : '#00a86b',
          backgroundColor: isDark ? 'rgba(0,255,156,0.1)' : 'rgba(0,168,107,0.08)',
          tension: 0.3,
          fill: true,
          pointRadius: 3,
          pointBackgroundColor: isDark ? '#00ff9c' : '#00a86b',
          borderWidth: 2
        },
        {
          label: '평균 (5경기)',
          data: movingAvg,
          borderColor: isDark ? '#ff2e88' : '#e91e63',
          backgroundColor: 'transparent',
          tension: 0.4,
          borderWidth: 1.5,
          borderDash: [4, 4],
          pointRadius: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: { color: textColor, font: { size: 11, family: 'JetBrains Mono' } }
        },
        tooltip: {
          backgroundColor: isDark ? '#141a23' : '#ffffff',
          borderColor: gridColor,
          borderWidth: 1,
          titleColor: isDark ? '#e6edf3' : '#1a1f2e',
          bodyColor: textColor,
          padding: 12,
          titleFont: { family: 'JetBrains Mono', size: 11 },
          bodyFont: { family: 'JetBrains Mono', size: 12 }
        }
      },
      scales: {
        x: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor, drawBorder: false } },
        y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor, drawBorder: false }, beginAtZero: true }
      }
    }
  });
}

function renderBotStats() {
  const BOT_INFO = {
    turtle: { name: 'TURTLE.01', wpm: 25, color: '#4ecdc4' },
    rookie: { name: 'ROOKIE.K', wpm: 45, color: '#ffb347' },
    sharp: { name: 'SHARP.X', wpm: 70, color: '#ff2e88' },
    ninja: { name: 'NINJA.Z', wpm: 95, color: '#a855f7' },
    king: { name: 'KING.∞', wpm: 130, color: '#00ff9c' }
  };

  const grouped = {};
  allMatches.forEach(m => {
    if (!grouped[m.bot_id]) grouped[m.bot_id] = { total: 0, wins: 0, totalWpm: 0 };
    grouped[m.bot_id].total++;
    grouped[m.bot_id].totalWpm += m.wpm;
    if (m.result === 'win') grouped[m.bot_id].wins++;
  });

  let html = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">';
  Object.keys(BOT_INFO).forEach(id => {
    const info = BOT_INFO[id];
    const stats = grouped[id];
    const played = stats?.total || 0;
    const winRate = stats ? Math.round((stats.wins / stats.total) * 100) : 0;
    const avgWpm = stats ? Math.round(stats.totalWpm / stats.total) : 0;

    html += `
      <div style="border: 1px solid var(--border); border-left: 3px solid ${info.color}; border-radius: 4px; padding: 14px;">
        <div style="font-family: var(--mono); font-size: 13px; font-weight: 700; color: ${info.color}; margin-bottom: 8px;">${info.name}</div>
        <div style="font-size: 11px; color: var(--text-dim); line-height: 1.8;">
          <div>플레이 <span style="color: var(--text); font-weight: 700;">${played}</span> 경기</div>
          <div>승률 <span style="color: var(--text); font-weight: 700;">${winRate}%</span></div>
          <div>평균 WPM <span style="color: var(--text); font-weight: 700;">${avgWpm}</span></div>
        </div>
      </div>`;
  });
  html += '</div>';
  $('botStats').innerHTML = html;
}

function renderMatchTable() {
  const recent = [...allMatches].reverse().slice(0, 20);
  const tbody = $('matchTbody');
  tbody.innerHTML = recent.map(m => {
    const date = new Date(m.played_at);
    const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
    const resultCls = m.result === 'win' ? 'result-win' : 'result-lose';
    const resultText = m.result === 'win' ? 'WIN' : 'LOSE';
    return `
      <tr>
        <td class="${resultCls}">${resultText}</td>
        <td>${m.bot_name}</td>
        <td class="wpm-cell">${m.wpm}</td>
        <td>${m.accuracy}%</td>
        <td>${dateStr}</td>
      </tr>`;
  }).join('');
}
</script>
</body>
</html>
