<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 — TYPING.KING</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Bungee&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-theme="dark">

<div class="container">
  <header class="header" id="header"></header>

  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">WELCOME</h1>
      <p class="login-sub">로그인하면 기록과 성장 그래프가 저장됩니다</p>

      <div class="tab-bar">
        <button class="tab active" data-tab="login">로그인</button>
        <button class="tab" data-tab="signup">회원가입</button>
      </div>

      <form id="authForm">
        <div class="form-group" id="nicknameGroup" style="display:none">
          <label class="form-label">닉네임</label>
          <input type="text" class="form-input" id="nickname" placeholder="3~12자 한글/영문" maxlength="12" />
        </div>

        <div class="form-group">
          <label class="form-label">이메일</label>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="password" class="form-input" id="password" placeholder="6자 이상" minlength="6" required />
        </div>

        <div class="form-error" id="formError"></div>

        <button type="submit" class="btn primary" id="btnSubmit" style="width:100%; justify-content:center; margin-top: 8px;">
          <span class="arrow">▶</span> <span id="submitLabel">로그인</span>
        </button>
      </form>

      <div class="divider-or">OR</div>

      <button class="btn btn-google" id="btnGoogle">
        <span style="font-size:14px;">G</span> GOOGLE 로 계속하기
      </button>

      <p style="margin-top: 20px; font-size: 11px; color: var(--text-faint); text-align: center; letter-spacing: 1px;">
        로그인 없이도 게임은 플레이할 수 있어요<br>
        <a href="../index.html" style="color: var(--text-dim); text-decoration: underline;">게스트로 시작 →</a>
      </p>
    </div>
  </div>

  <footer class="footer">TYPING.KING &nbsp;·&nbsp; LOGIN PORTAL</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>

<script>
(async function init() {
  await initHeader('login');
  // 이미 로그인 상태면 메인으로
  if (Auth.isLoggedIn()) {
    window.location.href = '../index.html';
  }
})();

const $ = id => document.getElementById(id);
let mode = 'login';

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.tab;
    $('nicknameGroup').style.display = mode === 'signup' ? 'block' : 'none';
    $('submitLabel').textContent = mode === 'signup' ? '회원가입' : '로그인';
    $('formError').textContent = '';
  });
});

$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  const nickname = $('nickname').value.trim();
  const errEl = $('formError');
  const btn = $('btnSubmit');
  errEl.textContent = '';

  if (mode === 'signup') {
    if (!nickname || nickname.length < 2) {
      errEl.textContent = '닉네임은 2자 이상 입력해주세요';
      return;
    }
    btn.disabled = true;
    btn.querySelector('#submitLabel').textContent = '가입 중...';
    const { error } = await Auth.signUp(email, password, nickname);
    btn.disabled = false;
    btn.querySelector('#submitLabel').textContent = '회원가입';
    if (error) {
      if (error.code === '23505') errEl.textContent = '이미 사용 중인 닉네임입니다';
      else errEl.textContent = error.message || '회원가입에 실패했습니다';
      return;
    }
    showToast('가입 완료! 이메일을 확인해 주세요');
    setTimeout(() => window.location.href = '../index.html', 1500);
  } else {
    btn.disabled = true;
    btn.querySelector('#submitLabel').textContent = '로그인 중...';
    const { error } = await Auth.signIn(email, password);
    btn.disabled = false;
    btn.querySelector('#submitLabel').textContent = '로그인';
    if (error) {
      errEl.textContent = error.message === 'Invalid login credentials'
        ? '이메일 또는 비밀번호가 일치하지 않습니다'
        : (error.message || '로그인에 실패했습니다');
      return;
    }
    showToast('로그인 성공!');
    setTimeout(() => window.location.href = '../index.html', 800);
  }
});

$('btnGoogle').addEventListener('click', async () => {
  const { error } = await Auth.signInWithGoogle();
  if (error) {
    $('formError').textContent = 'Google 로그인 실패: ' + error.message;
  }
});
</script>
</body>
</html>
